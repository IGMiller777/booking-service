name: booking-service

services:
  postgres:
    image: postgres:18
    container_name: booking-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set, see .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set, see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is not set, see .env.example}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
volumes:
  pgdata:
